<!doctype html><html lang="zh"><meta charset="utf-8"><title>CityWalk · 网页语音缓存</title><style>body{font:18px system-ui;max-width:760px;margin:30px auto}button,input{font:inherit;padding:10px;margin:5px}li{margin:10px}pre{white-space:pre-wrap}</style><h1>GPT 网页语音缓存</h1><p>只录制 Chrome 播放的网页声音。请保持其他 Chrome 视频暂停。</p><label>讲解编号<input id="cue" type="number" value="2" min="1"></label><label>Chrome 进程<input id="pid" type="number" placeholder="Chrome PID"></label><button id="start">开始录制</button><button id="stop">保存录制</button><pre id="result"></pre><ol id="entries"></ol><script>const token='__TOKEN__';async function api(p,d){let r=await fetch(p,{method:'POST',headers:{'x-control-token':token,'content-type':'application/json'},body:JSON.stringify(d||{})});let x=await r.json();result.textContent=JSON.stringify(x);if(!r.ok)throw Error(x.detail);return x}start.onclick=()=>api('/record/start',{id:+cue.value,pid:+pid.value});stop.onclick=()=>api('/record/stop').then(()=>cue.value=+cue.value+1);async function refresh(){let x=await(await fetch('/prepared',{headers:{'x-control-token':token}})).json();entries.replaceChildren(...x.entries.map(e=>{let li=document.createElement('li');li.textContent=(e.audio?'✓ ':'')+e.text;return li}))}refresh();</script></html>
