<!doctype html><html lang="zh"><meta charset="utf-8"><title>CityWalk · 同步陪看</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:white;font:16px system-ui}#stage{height:100vh;position:relative;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain}#hud{position:absolute;right:2%;bottom:11%;width:min(420px,40vw);resize:both;overflow:auto;min-width:220px;max-width:90vw;max-height:70vh;background:transparent;z-index:2}#handle{background:#000b;padding:7px;cursor:move;font-size:12px}#preview{width:100%;display:none}#text{background:#000b;padding:12px;font-size:22px;line-height:1.5;display:none}#bar{position:absolute;left:1%;top:1%;background:#000b;padding:8px;border-radius:6px;opacity:.15;transition:opacity .2s;z-index:3}#stage:hover #bar{opacity:1}button{padding:6px;margin:2px}#progress{font-size:13px}#hud.empty{width:auto;resize:none}#hud.empty #handle{display:none}</style><div id="stage"><video id="video" controls playsinline></video><audio id="ambient"></audio><audio id="voice"></audio><div id="bar"><button id="full">全屏</button><button id="startCompanion">开始陪看</button><button id="stopAll">停止所有任务</button><button id="gptSetup">登录/设置 GPT</button><input id="videoURL" style="width:260px" placeholder="新视频：粘贴 B 站 BV 链接"><button id="prepare">准备新视频（会使用 GPT）</button><label><input id="speak" type="checkbox" checked>自然语音</label><label>原声<input id="background" type="range" min="0" max="100" value="65"></label><label><input id="pictures" type="checkbox">显示对应截图</label><span id="progress">连接中</span></div><div id="hud" class="empty"><div id="handle"></div><img id="preview"><div id="text"></div></div></div><script>
const token='__TOKEN__',v=document.querySelector('#video'),a=document.querySelector('#ambient'),speech=document.querySelector('#voice'),hud=document.querySelector('#hud'),text=document.querySelector('#text'),img=document.querySelector('#preview');v.muted=true;let entries=[],current=null,lastAt=0,speaking=false,activeVideo='',companionEnabled=false,lastStopId=0;let fade;const volume=()=>{cancelAnimationFrame(fade);let target=speaking?Math.min(.06,Number(background.value)/100*.08):Number(background.value)/100,start=a.volume,begin=performance.now(),duration=speaking?150:400;function step(now){let t=Math.min(1,(now-begin)/duration);a.volume=start+(target-start)*t;if(t<1)fade=requestAnimationFrame(step)}fade=requestAnimationFrame(step)};volume();background.oninput=volume;speech.volume=1;
function stopSpeech(){speech.pause();speech.removeAttribute('src');speaking=false;volume()}
function sync(){if(Math.abs(a.currentTime-v.currentTime)>.25)a.currentTime=v.currentTime;a.playbackRate=v.playbackRate;if(v.paused)a.pause();else if(a.paused)a.play().catch(()=>{});let e=companionEnabled?entries.find(e=>v.currentTime>=e.at&&v.currentTime<e.end):null;if(e?.id!==current?.id){stopSpeech();current=e;hud.classList.toggle('empty',!e);text.style.display=e?'block':'none';img.style.display=e&&pictures.checked?'block':'none';if(e){text.textContent=e.text;handle.textContent='☰ 拖动 · '+new Date(e.at*1000).toISOString().slice(11,19);img.src='data:image/jpeg;base64,'+e.thumbnail;if(e.audio&&speak.checked&&!v.paused&&v.currentTime-e.at<4){speech.src='/media/'+encodeURIComponent(e.audio)+'?token='+token+'&v='+activeVideo;speech.playbackRate=v.playbackRate;speaking=true;volume();speech.play().catch(stopSpeech)}}}lastAt=v.currentTime}
v.onplay=()=>{if(!speech.getAttribute('src'))current=null;if(speech.getAttribute('src')&&!speech.ended&&current){speaking=true;volume();speech.play().catch(stopSpeech)}a.currentTime=v.currentTime;a.play().catch(()=>{});sync()};v.onpause=()=>{a.pause();speech.pause();speaking=false;volume()};v.onseeking=()=>{stopSpeech();current=null;sync()};v.onended=()=>{stopSpeech();a.pause()};v.onratechange=()=>{speech.playbackRate=v.playbackRate;sync()};v.ontimeupdate=sync;speech.onended=speech.onerror=()=>{speaking=false;volume()};full.onclick=()=>document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen();pictures.onchange=()=>img.style.display=current&&pictures.checked?'block':'none';speak.onchange=()=>{if(!speak.checked)stopSpeech()};
let drag;handle.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,l:hud.offsetLeft,t:hud.offsetTop};handle.setPointerCapture(e.pointerId)};handle.onpointermove=e=>{if(!drag)return;hud.style.left=Math.max(0,Math.min(innerWidth-hud.offsetWidth,drag.l+e.clientX-drag.x))+'px';hud.style.top=Math.max(0,Math.min(innerHeight-50,drag.t+e.clientY-drag.y))+'px';hud.style.right=hud.style.bottom='auto'};handle.onpointerup=()=>{drag=null;localStorage.setItem('citywalk-hud',JSON.stringify({left:hud.style.left,top:hud.style.top,width:hud.style.width,height:hud.style.height}))};try{Object.assign(hud.style,JSON.parse(localStorage.getItem('citywalk-hud')||'{}'))}catch{}
startCompanion.onclick=()=>{companionEnabled=true;current=null;startCompanion.textContent='陪看已开启';sync()};stopAll.onclick=async()=>{v.pause();companionEnabled=false;stopSpeech();current=null;sync();startCompanion.textContent='开始陪看';progress.textContent='正在停止…';stopAll.disabled=true;try{let r=await fetch('/action/stop',{method:'POST',headers:{'x-control-token':token}});if(!r.ok)throw Error();progress.textContent='已停止，缓存保留'}catch{progress.textContent='本地播放已停止；后台停止未确认，请关闭应用'}finally{stopAll.disabled=false}};gptSetup.onclick=()=>fetch('/action/browser',{method:'POST',headers:{'x-control-token':token}});prepare.onclick=async()=>{prepare.disabled=true;await fetch('/prepare',{method:'POST',headers:{'x-control-token':token,'content-type':'application/json'},body:JSON.stringify({video_url:videoURL.value})})};async function refresh(){try{let r=await fetch('/prepared',{headers:{'x-control-token':token}});let d=await r.json();if(d.stop_id!==lastStopId){lastStopId=d.stop_id;v.pause();companionEnabled=false;stopSpeech();current=null;startCompanion.textContent='开始陪看'}if(d.media_ready&&activeVideo!==d.video_id){stopSpeech();v.pause();v.src='/media/video?token='+token+'&v='+d.video_id;a.src='/media/background?token='+token+'&v='+d.video_id;current=null;restorePosition=true}if(d.media_ready)activeVideo=d.video_id;if(!videoURL.value)videoURL.value=d.video_url;entries=d.entries;if(restorePosition&&v.readyState>=1){restoreSavedPosition()}progress.textContent=d.progress.status+' '+d.progress.done+'/'+d.progress.total+(d.progress.error?' · '+d.progress.error:'');prepare.disabled=d.preparing;sync()}catch{progress.textContent='本地服务已停止'}}let restorePosition=true;function restoreSavedPosition(){if(restorePosition&&activeVideo){let pos=Number(localStorage.getItem('citywalk-position-'+activeVideo)||0);if(pos>0&&pos<v.duration-3)v.currentTime=pos;restorePosition=false}}v.onloadedmetadata=restoreSavedPosition;setInterval(()=>{if(activeVideo&&v.currentTime>0)localStorage.setItem('citywalk-position-'+activeVideo,String(v.currentTime))},2000);document.addEventListener('keydown',e=>{if(e.key==='Escape')stopAll.onclick()});setInterval(refresh,1000);refresh();
</script></html>
